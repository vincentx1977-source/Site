<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incorporamento Canva</title>
  <style>
    /* Stili generali */
    body {
      margin: 0;
      padding: 0;
      background-color: #000; /* Sfondo nero per eliminare i bordi visibili */
    }
    /* Contenitore del sito Canva */
    .canva-container {
      position: relative;
      width: 100%;
      height: 500vh; /* Altezza dinamica: si adatta alla finestra del browser */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Stile dell'iframe */
    iframe {
      transform: scale(1.0); /* Scala il contenuto del sito per migliorare la leggibilità */
      transform-origin: top center; /* Punto di origine della scala */
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Contenitore per l'iframe -->
  <div class="canva-container">
    <iframe id="canva-iframe" loading="lazy"
      src="" allowfullscreen="allowfullscreen" allow="fullscreen">
    </iframe>
  </div>

  <script>
    // Funzione per ottenere la lingua preferita dal browser
    function getLanguage() {
      let lang = navigator.language || navigator.userLanguage;
      return lang.split('-')[0]; // Restituisce solo il codice della lingua (es. "en" per inglese, "it" per italiano)
    }

    // Cambia l'URL dell'iframe in base alla lingua
    function setIframeUrl() {
      const lang = getLanguage();
      const iframe = document.getElementById('canva-iframe');
      
      // Imposta l'URL in base alla lingua
			if (lang === 'it') {
        iframe.src = "https://www.canva.com/design/DAGadsxwfXc/AC6tR6emAzyNRBT6sKNZzw/view?embed"; // Aggiungi parametro per lingua italiana
      } else {
        iframe.src = "https://www.canva.com/design/DAGaeDFPs4Q/mRtW57n30T1XwOC9C9cnLA/view?embed"; // Default in caso di lingua non riconosciuta
      }
    }

    // Esegui la funzione per impostare l'URL all'avvio
    window.onload = setIframeUrl;
  </script>
</body>
</html>
